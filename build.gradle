plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://repo.hypixel.net/repository/Hypixel/' }
}
loom { accessWidenerPath = file('src/main/resources/greenhouse.accesswidener') }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'maven.modrinth:hypixel-mod-api:SlqCF6Or'
    include 'maven.modrinth:hypixel-mod-api:SlqCF6Or'
    compileOnly 'net.hypixel:mod-api:1.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release=25; options.encoding='UTF-8' }
java { withSourcesJar(); sourceCompatibility=JavaVersion.VERSION_25; targetCompatibility=JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
jar { from('LICENSE'); from('THIRD_PARTY_NOTICES.md'); from('licenses') { into 'licenses' } }
